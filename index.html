<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日志 BC组</title>
<style>
  :root {
    --bg: #f3f1ec; --paper: #ffffff; --ink: #1d1d1b; --muted: #8a877f;
    --edit: #fff6c8; --edit-line: #e2c94a; --calc: #e6f0fb; --bad: #ffd7d2; --bad-line: #d2433a;
    --ui: #2f6fb3; --border: #d9d5cc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1b1a; --paper: #262624; --ink: #ecebe6; --muted: #9a978f;
      --edit: #4a4320; --edit-line: #a8902c; --calc: #233447; --bad: #5a2622; --bad-line: #ff8379;
      --ui: #8ab8ea; --border: #44423d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1b1a; --paper: #262624; --ink: #ecebe6; --muted: #9a978f;
    --edit: #4a4320; --edit-line: #a8902c; --calc: #233447; --bad: #5a2622; --bad-line: #ff8379;
    --ui: #8ab8ea; --border: #44423d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.75 "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 8px 16px; background: var(--paper); border-bottom: 1px solid var(--border); }
  .bar b { margin-right: 8px; }
  .bar button, .bar label.btn { font: inherit; font-size: 14px; padding: 3px 12px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--paper); color: var(--ink); cursor: pointer; }
  .bar button.main { background: var(--ui); border-color: var(--ui); color: #fff; }
  .bar button.hot { background: var(--edit); border-color: var(--edit-line); }
  .bar input[type=date] { font: inherit; font-size: 14px; padding: 2px 6px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--paper); color: var(--ink); }
  .bar .msg { color: var(--muted); font-size: 13px; }
  .bar .msg.bad { color: var(--bad-line); }
  .legend { font-size: 13px; color: var(--muted); }
  .legend span { padding: 0 6px; border-radius: 3px; }
  main { max-width: 1100px; margin: 16px auto; padding: 0 16px; }
  .doc { background: var(--paper); border: 1px solid var(--border); border-radius: 4px; padding: 24px 32px; }
  .line { min-height: 1.75em; white-space: pre-wrap; word-break: break-all; position: relative; }
  .line:hover > .ui { visibility: visible; }
  [contenteditable] { background: var(--edit); border-bottom: 1px dashed var(--edit-line); outline: none;
    padding: 0 2px; border-radius: 2px; min-width: 1.5em; display: inline-block; }
  [contenteditable]:focus { box-shadow: 0 0 0 2px var(--edit-line); }
  [contenteditable]:empty::before { content: attr(data-ph); color: var(--muted); }
  .wrap:not(:empty)::before { content: "（"; }
  .wrap:not(:empty)::after { content: "）"; }
  .calc { background: var(--calc); border-radius: 2px; padding: 0 1px; }
  .bad { background: var(--bad) !important; border-bottom-color: var(--bad-line) !important; }
  select { font: inherit; color: var(--ink); background: var(--edit); border: 0; border-bottom: 1px dashed var(--edit-line);
    padding: 0; appearance: none; -webkit-appearance: none; cursor: pointer; }
  select.none { color: var(--muted); font-size: 12px; background: none; }
  .ui { visibility: hidden; font-size: 12px; margin-left: 8px; color: var(--ui); cursor: pointer; user-select: none; }
  .ui:hover { text-decoration: underline; }
  .add { display: block; visibility: visible; font-size: 13px; margin: 0 0 2px 0; color: var(--ui); opacity: .7; }
  .add:hover { opacity: 1; }
  .closed { color: var(--muted); text-decoration: line-through; }
  details { margin-top: 16px; background: var(--paper); border: 1px solid var(--border); border-radius: 4px; padding: 8px 16px; }
  details pre { white-space: pre-wrap; font: inherit; font-size: 14px; margin: 8px 0; }
  dialog { width: min(900px, 92vw); border: 1px solid var(--border); border-radius: 6px; background: var(--paper); color: var(--ink); }
  dialog textarea { width: 100%; height: 50vh; font: inherit; font-size: 14px; background: var(--bg); color: var(--ink); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper);
    padding: 8px 18px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: .92; }
  .tabs { display: inline-flex; margin-right: 8px; }
  .tabs button { border-radius: 0; }
  .tabs button:first-child { border-radius: 6px 0 0 6px; } .tabs button:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
  body[data-tab="journal"] #tabJournal, body[data-tab="todo"] #tabTodo { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  body[data-tab="journal"] .tonly, body[data-tab="todo"] .jonly { display: none !important; }
  .todohead { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
  .fname { font-weight: bold; }
  #hours { background: var(--paper); border: 1px solid var(--border); border-radius: 4px; padding: 10px 16px; margin-bottom: 12px; }
  .hhead { margin-bottom: 6px; }
  .hrow { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; padding: 2px 4px; border-radius: 4px; }
  .hrow select, .hrow input, #hours button { font: inherit; font-size: 14px; padding: 2px 6px; border: 1px solid var(--border); border-radius: 4px;
    background: var(--paper); color: var(--ink); appearance: auto; -webkit-appearance: auto; }
  .hrow input { flex: 1; background: var(--edit); }
  .hrow.bad { background: var(--bad); }
  #hours button { cursor: pointer; }
  .todohead input { font: inherit; padding: 2px 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--edit); color: var(--ink); }
  .addbox { display: flex; gap: 8px; margin-bottom: 16px; align-items: flex-start; }
  .addbox textarea { flex: 1; min-height: 64px; font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--paper); color: var(--ink); }
  .addbox button { font: inherit; padding: 6px 16px; border-radius: 6px; border: 1px solid var(--ui); background: var(--ui); color: #fff; cursor: pointer; }
  .card { background: var(--paper); border: 1px solid var(--border); border-left: 4px solid var(--edit-line); border-radius: 4px; padding: 8px 12px; margin-bottom: 8px; }
  .card.bad { background: var(--paper) !important; border-left-color: var(--bad-line) !important; }
  .card.ok { border-left-color: #3f9b5a; opacity: .75; }
  .card:hover .ui { visibility: visible; }
  .cardtop { display: flex; gap: 8px; align-items: baseline; }
  .cardtop [contenteditable] { background: none; border-bottom: 1px dashed var(--border); }
  .code { font-weight: bold; min-width: 6em; }
  .desc { flex: 1; }
  .chip { font-size: 12px; padding: 0 8px; border-radius: 10px; background: var(--calc); white-space: nowrap; }
  .chip.st[data-s="OK"] { background: #3f9b5a; color: #fff; } .chip.st[data-s="G"] { background: var(--edit-line); color: #000; }
  .notes { width: 100%; margin-top: 6px; font: inherit; line-height: 1.6; padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px;
    background: var(--edit); color: var(--ink); resize: none; overflow: hidden; }
  .cardbtns { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  .cardbtns button { font: inherit; font-size: 13px; padding: 1px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--paper); color: var(--ink); cursor: pointer; }
  .prob { color: var(--bad-line); font-size: 13px; }
  @media print { .bar, .ui, .add, details { display: none !important; } [contenteditable], .calc, select { background: none; border: 0; } }
</style>
</head>
<body>
<div class="bar">
  <span class="tabs"><button id="tabJournal">日志</button><button id="tabTodo">日常清单</button></span>
  日期 <input type="date" id="day">
  <span class="jonly"><button class="main" id="copy">复制日志</button>
  <button id="week" title="把每周回顾的日期和统计数字更新到今天">周五更新统计</button>
  <button id="hist">以前的日志</button>
  <button id="imp">导入现有日志</button>
  <button id="sample">格式范本</button></span>
  <span class="tonly"><button class="main" id="xlsxOut">下载Excel</button>
  <label class="btn">导入Excel<input type="file" id="xlsxIn" accept=".xlsx" hidden></label></span>
  <button id="export">备份到文件</button>
  <label class="btn">从备份恢复<input type="file" id="import" accept=".json" hidden></label>
  <span class="msg" id="msg"></span>
  <span class="legend"><span style="background:var(--edit)">黄色 = 填写</span> <span style="background:var(--calc)">蓝色 = 自动</span> <span style="background:var(--bad)">红色 = 要检查</span></span>
</div>
<main>
  <div class="jonly" id="hours"></div>
  <div class="doc jonly" id="doc"></div>
  <div id="todo" class="tonly"></div>
  <details class="jonly">
    <summary>日志规则（参考，不复制进日志）</summary>
    <pre id="rules"></pre>
    <p class="legend">自动做的：日期码、工时总计、本周第几周、+/- 号（今天改过的事项是 +，其他是 -）、计划日期检查（不能是今天或过去）、
      计划日期写 X 的事项第二天自动删除、各类登记数、客户数、每周回顾的日期和统计（按“周五更新统计”时记下）。</p>
  </details>
</main>
<dialog id="histDlg">
  <p><select id="histSel"></select> <button id="histClose">关闭</button></p>
  <textarea id="histText" readonly></textarea>
</dialog>
<dialog id="sampleDlg">
  <p>日志格式范本（日志格式-BC组员-2251023）<button id="sampleClose" style="float:right">关闭</button></p>
  <textarea id="sampleText" readonly></textarea>
</dialog>
<dialog id="impDlg">
  <p>把现有的日志文字整篇粘贴进来（规则部分可以不要），按“检查”。</p>
  <textarea id="impText"></textarea>
  <p><button id="impCheck">检查</button> <button id="impDo" disabled>导入</button> <button id="impClose">关闭</button></p>
  <pre id="impResult" style="white-space:pre-wrap"></pre>
</dialog>
<div class="toast" id="toast"></div>

<script>
"use strict";
// Everything the journal remembers is kept in this browser (localStorage), on this PC only.
const KEY = "journal-bc-v1";
const CATS = ["", "客诉", "欠包装", "测试未过", "进度核对", "船期预警", "品质", "会议"];
const HOUR_LABELS = ["邮件回复", "立项开发", "搜款推客", "其他开发", "定单相关", "单据", "整样", "其他事务"];

// ---------- dates ----------
function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function fromIso(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function mmdd(d) { return String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0"); }
function isoWeek(d) {
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + 3 - (t.getDay() + 6) % 7);
  const w1 = new Date(t.getFullYear(), 0, 4);
  return 1 + Math.round(((t - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7);
}
function monday(d) { const t = new Date(d); t.setDate(t.getDate() - (t.getDay() + 6) % 7); return t; }
function lastFriday(d) { const t = new Date(d); t.setDate(t.getDate() - (t.getDay() + 2) % 7); return t; }
// a 4-digit MMDD near the journal day -> Date (picks the year so it is within half a year)
function mmddToDate(s, ref) {
  if (!/^\d{4}$/.test(s)) return null;
  const m = +s.slice(0, 2), d = +s.slice(2);
  if (m < 1 || m > 12 || d < 1 || d > 31) return null;
  let t = new Date(ref.getFullYear(), m - 1, d);
  if (t - ref > 182 * 864e5) t = new Date(ref.getFullYear() - 1, m - 1, d);
  if (ref - t > 182 * 864e5) t = new Date(ref.getFullYear() + 1, m - 1, d);
  return t;
}

let DAY = new Date(); DAY = new Date(DAY.getFullYear(), DAY.getMonth(), DAY.getDate());
const today = () => iso(DAY);
const T = () => mmdd(DAY);

// ---------- the fixed lines: text, {d} = journal date, {w} = weekly date, {f: box}, {c: automatic} ----------
const DAILY = [
  ["*组内日常清单表：", { d: 1 }, "当天接收", { c: "tdIn" }, "，当天完成", { c: "tdDone" }, "，未结", { c: "tdOpen" }, "，传递：", { c: "tdSent" }],
  ["*接单/出货系统更新：", { d: 1 }, { f: "d2" }],
  ["*在手需下样还未下样款数：", { d: 1 }, { f: "d3" }],
  ["*客户投诉：", { d: 1 }, { f: "d4" }, "，今入持续关注区登记客诉：", { c: "newComplaints" }, "条"],
];
const WEEKLY = [
  ["*本周工厂意见/投诉：", { w: 1 }, { f: "w1" }],
  ["*本周搜款推客：", { w: 1 }, { f: "w2" }],
  ["*本周来联系我们C2C3C4客/新客数：", { w: 1 }, { f: "w3" }],
  ["*负责C1C2客户数：", { w: 1 }, " C1日志", { c: "c1" }, "系统", { f: "w4a" }, ", C2日志", { c: "c2" }, "系统", { f: "w4b" }, { f: "w4c" }],
  ["*未结账务：", { w: 1 }, { f: "w5" }],
  ["*已投产欠包装：", { w: 1 }, { f: "w6" }, "，持续关注区登记欠包装：", { c: "欠包装" }],
  ["*测试未过：", { w: 1 }, { f: "w7" }, "，持续关注区登记：", { c: "测试未过" }],
  ["*进度核对/船期预警：", { w: 1 }, "进度核对", { f: "w8a" }, "，船期预警", { f: "w8b" }, "；持续关注区登记：进度核对", { c: "进度核对" }, "船期预警", { c: "船期预警" }],
  ["*品质关注点：", { w: 1 }, { f: "w9" }, "，持续关注区登记品质：", { c: "品质" }],
  ["*待开客户会议/来访：", { w: 1 }, { f: "w10a" }, "，持续关注区登记会议：", { c: "会议" }, { f: "w10b" }],
  ["*本周入系统订单款数：", { w: 1 }, { f: "w11" }],
  ["*系统在手设计稿-业务模块：", { w: 1 }, { f: "w12" }],
  ["*本周下样数：", { w: 1 }, { f: "w13" }],
  ["*未完试样单数：", { w: 1 }, { f: "w14" }],
  ["*本周超30天样单数：", { w: 1 }, { f: "w15a" }, { w: 1 }, { f: "w15b" }],
];
const fieldsOf = lines => lines.flat().filter(p => p.f).map(p => p.f);

// ---------- storage ----------
function load() {
  try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) {}
  return null;
}
function save() {
  if (S.weekDate === today()) S.weekSnap = counts();   // weekly numbers follow the page on the update day, then stay
  if (doc.childNodes.length) S.archive[today()] = journalText();
  const days = Object.keys(S.archive).sort(); days.slice(0, -60).forEach(d => delete S.archive[d]);
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { msg("保存失败：浏览器不让存数据", true); }
}

// ---------- a new day ----------
// Runs the first time the page is opened on a later day than the last entry. Days not opened don't exist.
// Yesterday's typed values stay visible in grey inside the empty boxes.
function newDay() {
  if (S.lastDay && today() <= S.lastDay) return;
  const last = S.lastDay ? fromIso(S.lastDay) : null;
  // keep the last value that was actually typed (a box left empty keeps the older grey hint)
  const old = S.prev || { f: {}, hours: [] };
  S.prev = { f: { ...old.f }, hours: S.hours.map((h, i) => (h.h || h.note) ? { ...h } : (old.hours[i] || { ...h })) };
  Object.keys(S.f).forEach(k => { if (S.f[k]) S.prev.f[k] = S.f[k]; });
  S.hours.forEach(h => { h.h = ""; h.note = ""; });
  S.entries = [];
  fieldsOf(DAILY).forEach(k => { S.f[k] = ""; });
  if (DAY.getDay() === 5) {                                  // Friday: weekly review starts empty, dated today
    fieldsOf(WEEKLY).forEach(k => { S.f[k] = ""; });
    S.weekDate = today();
  }
  if (last && iso(monday(DAY)) !== iso(monday(last))) {      // first entry of a new week: W-items get the new week no.
    const next = new Date(monday(DAY)); next.setDate(next.getDate() + 7);
    S.remind.forEach(x => { if (/^W\d+$/.test(x.start)) { x.start = "W" + isoWeek(DAY); x.plan = mmdd(next); } });
  }
  S.lastDay = today();
}

// ---------- starting content (the template's example) ----------
function it(start, cat, text, plan, plus) { return { start, cat, text, plan, edited: plus ? today() : "", closed: "" }; }
function blank() {
  return { hours: HOUR_LABELS.map(label => ({ label, h: "", note: "" })), f: {}, weekDate: iso(lastFriday(DAY)), weekSnap: null,
    remind: [], focus: [], clients: [], c1none: [], c2: [], archive: {}, prev: null, lastDay: today() };
}
function seed() {
  const s = blank();
  [["1", "MDC，TTT为主"], ["1.5", "淘图0.5，整理集体图0.5，下样单0.5"], ["0.5", "给HKM挑推30款0.5"],
   ["1.5+", "找温州小凉鞋新工厂0.25，下样TRT 0.25，催样1+"], ["1-", "MDC条码处理 0.5-，TTS货期沟通0.5"],
   ["0.5", "TRT"], ["0.5", "LFGW"], ["0.75", "日志0.25，做卫生0.5"]].forEach(([h, note], i) => Object.assign(s.hours[i], { h, note }));
  s.entries = [[0, "MDC，TTT为主", 60], [1, "淘图", 30], [1, "整理集体图", 30], [1, "下样单", 30], [2, "给HKM挑推30款", 30],
    [3, "找温州小凉鞋新工厂", 15], [3, "下样TRT", 15], [3, "催样", 60, "+"], [4, "MDC条码处理", 30, "-"], [4, "TTS货期沟通", 30],
    [5, "TRT", 30], [6, "LFGW", 30], [7, "日志", 15], [7, "做卫生", 30]].map(([cat, text, min, sign]) => ({ cat, text, min, sign: sign || "" }));
  s.f = {
    d1: "当天接收4，当天完成3，未结2，传递：17：50已传",
    d2: "已接单未入系统：AAA/2款0.6W啥原因1029（仅前道业务）；已接单未交接后道：AAA/2款/客已下单2天（仅前道业务）；已出货未更新系统：AAA/2.5W 1029（仅后道业务）",
    d3: "款2：AAA款1，ABC款1，打算如何1029",
    d4: "/1条, 知会QC/QA：1条；阿文确认收到：1条",
    w1: "投诉2，某厂投诉如何如何，某某厂投诉如何如何",
    w2: "/2客AAA/22款，BBB/50款，下周计划：1客CEC1024（仅前道业务）",
    w3: "/2客，激活：1/某国DDD，新入系统：1/某国CENTE；系统更新自评：5（仅前道业务）",
    w4a: "4", w4b: "1", w4c: "；与系统客户总表校对时点：1017/14:30完成（仅前道业务）",
    w5: "如何如何", w6: "款1", w7: "款1", w8a: "2", w8b: "1", w9: "需关注点2",
    w10a: "客1", w10b: "，系统客户来访待开会议数1；系统更新自评：5",
    w11: "款5，最久在手工作天数1天，入系统速度自评：5（）",
    w12: "已通过未下样数2，下样推进时效自评：4（如何如何）（仅有立项业务）",
    w13: "样3，最久在手工作天数1天，下样速度自评：5（）",
    w14: "单3，无需试样备注描述合规自评：5",
    w15a: "：1单，上周2单；本周最久已下样119天；本周本人做了哪些推动工作/自评：", w15b: "如何如何/自评：4.5",
  };
  s.remind = [it("W" + isoWeek(DAY), "", "周一传未完日常清单表，1020已传（或：1020无未完记录），下周", "1027", false)];
  s.focus = [
    it("1021", "客诉", "某客投诉某事，已知会QC/QA，阿文已确认收到，1022如何如何", "1029", false),
    it(T(), "客诉", "AAA如何如何，已知会QC/QA，阿文已确认收到", "1027", true),
    it(T(), "欠包装", "AAA某厂1款，如何如何", "1030", true),
    it("1020", "测试未过", "AAA某厂1款，如何如何", "1030", false),
    it("1017", "进度核对", "ABC进度表发哪些QC，进度目前没有问题", "1024", false),
    it("1017", "进度核对", "DDD进度表发哪些QC，进度目前没有问题", "1024", false),

// editable box: get/set read and write the stored value
function ed(get, set, ph, opts = {}) {

  if (opts.check) refreshers.push(() => s.classList.toggle("bad", !opts.check()));

// Hours are written the group leader's way: 4h15 = 4 hours 15 minutes, 4h = 4 hours, "+"/"-" at the end.
// Typing 1.5, 1.5h, 1:30, 90m or 1h30 all mean the same; the box is tidied to 1h30 when you leave it.
function parseHours(text) {
  let t = (text || "").replace(/\s+/g, "").replace(/小时|時|H/g, "h").replace(/分钟|分|min/g, "m").replace(/：/g, ":");
  const sign = (t.match(/[+-](?=[^+-]*$)/) || [""])[0]; t = t.replace(/[+-]/g, "");
  let m;
  if (t === "") return { min: 0, sign };
  if ((m = t.match(/^(\d+)h(\d{1,2})m?$/)) && +m[2] < 60) return { min: +m[1] * 60 + +m[2], sign };
  if ((m = t.match(/^(\d+):(\d{2})$/)) && +m[2] < 60) return { min: +m[1] * 60 + +m[2], sign };
  if ((m = t.match(/^(\d*\.?\d+)h?$/))) return { min: Math.round(+m[1] * 60), sign };
  if ((m = t.match(/^(\d+)m$/))) return { min: +m[1], sign };
  return null;
}
function fmtHours(min, sign) { const h = Math.floor(min / 60), m = min % 60; return h + "h" + (m ? String(m).padStart(2, "0") : "") + (sign || ""); }
function tidyHours(text) { const p = parseHours(text); return p && text.trim() ? fmtHours(p.min, p.sign) : text; }
// Time is entered as a list of entries (category, what, hours, minutes), like a timesheet app;
// the @ lines are written from them. Old journals (typed hours) are turned into entries once.
function migrateHours() {
  if (S.entries) return;
  S.entries = S.hours.flatMap((h, i) => { const p = parseHours(h.h); return p && p.min ? [{ cat: i, text: h.note || "", min: p.min, sign: p.sign }] : []; });
}
function sumOf(es) {
  const min = es.reduce((a, e) => a + (+e.min || 0), 0);
  return fmtHours(min, es.some(e => e.sign === "+") ? "+" : es.some(e => e.sign === "-") ? "-" : "");
}
// one entry: just its text; several: each with its own time (rule 1)
function noteOf(es) {
  const named = es.filter(e => e.text.trim());
  if (!named.length) return "";
  return es.length === 1 ? named[0].text.trim() : named.map(e => e.text.trim() + fmtHours(+e.min || 0, e.sign)).join("，");
}
function hoursTotal() { return sumOf(S.entries); }

// ---------- the text that gets copied = exactly what is on the page ----------
function textOf(node) {
  let out = "";
  node.childNodes.forEach(n => {
    if (n.nodeType === 3) { out += n.textContent; return; }
    if (n.classList.contains("ui")) return;
    if (n.tagName === "SELECT") { out += n.dataset.out === "cat" ? (n.value ? n.value + "：" : "") : n.value; return; }
    let t = n.textContent;
    if (t === "" && n.dataset.empty) t = n.dataset.empty;
    if (n.classList.contains("wrap") && t !== "") t = "（" + t + "）";
    out += t;
  });
  return out;
}
function journalText() {
  return [...doc.querySelectorAll(".line")].map(textOf).join("\r\n");

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  const ta = el("textarea"); ta.value = t; document.body.append(ta); ta.select();
  const ok = document.execCommand("copy"); ta.remove(); return ok;
}

// ---------- reading an existing journal (pasted text) ----------
// Tolerant: spaces, half/full-width punctuation and a missing category don't matter.
// Lines it can't place are listed, nothing is guessed.
const PUNCT = { "：": ":", "，": ",", "；": ";", "（": "(", "）": ")", "／": "/" };
function litRe(s) {
  return [...s.replace(/\s+/g, "")].map(ch => {
    const alt = PUNCT[ch] || Object.keys(PUNCT).find(k => PUNCT[k] === ch);
    return alt ? "[" + ch + alt + "]" : ch.replace(/[.*+?^${}()|[\]\\\/-]/g, "\\$&");
  }).join("\\s*");
}
function specRe(spec) {
  return new RegExp("^" + spec.map(p => typeof p === "string" ? litRe(p) : p.f ? "(.*?)" : p.c ? ".*?" : "\\s*\\d{4}\\s*").join("") + "\\s*$");
}
function parseItem(t, withCat) {
  const m = t.match(/^[+\-－–—]\s*(W\d+|M\d+|\d{4})?\s*(.*?)\s*(\d{4}|[Xx])?\s*$/);
  if (!m) return null;
  let cat = "", text = m[2];
  if (withCat) {
    const c = text.match(new RegExp("^(" + CATS.slice(1).join("|") + ")\\s*[：:]\\s*"));
    if (c) { cat = c[1]; text = text.slice(c[0].length); }
  }
  const plan = (m[3] || "").toUpperCase();
  return { start: m[1] || "", cat, text, plan, edited: "", closed: plan === "X" ? today() : "" };
}
function parseJournal(raw) {
  const s = blank(), missed = [];
  let sec = "", client = null, pl = null, read = 0;
  const lines = raw.split(/\r?\n/).map(l => l.replace(/\s+$/, "")).filter(l => l.trim());
  for (let t of lines) {
    t = t.trim();
    if (/^(规则|备忘|●备忘)|^——/.test(t) || /^●\s*备忘/.test(t)) { if (/规则/.test(t)) break; sec = "skip"; continue; }
    if (/^-{5,}/.test(t)) continue;
    if (/^\d*\s*@/.test(t)) {
      const rest = t.replace(/^\d*\s*@\s*/, "");
      if (rest.startsWith("总计")) { read++; continue; }
      const k = HOUR_LABELS.findIndex(l => rest.startsWith(l));
      const m = k >= 0 && rest.slice(HOUR_LABELS[k].length).match(/^\s*([^（(]*?)\s*(?:[（(](.*)[）)])?\s*$/);
      if (m && parseHours(m[1])) { s.hours[k].h = tidyHours(m[1]); s.hours[k].note = (m[2] || "").trim(); read++; } else missed.push(t);
      continue;
    }
    if (/^▲\s*每日回顾/.test(t)) { sec = "daily"; read++; continue; }
    if (/^▲\s*提醒/.test(t)) { sec = "remind"; read++; continue; }
    if (/^▲\s*持续关注/.test(t)) { sec = "focus"; read++; continue; }
    if (/^●●\s*每周回顾/.test(t)) {
      sec = "weekly"; read++;
      const m = t.match(/(\d{4})\s*更新/); const d = m && mmddToDate(m[1], DAY); if (d) s.weekDate = iso(d);
      continue;
    }
    if (/^●\s*C1\s*有单老客/.test(t)) { sec = "clients"; read++; continue; }
    if (/^●\s*C1\s*无单老客/.test(t)) { sec = "c1none"; read++; continue; }
    if (/^●\s*C2\s*目标客/.test(t)) { sec = "c2"; read++; continue; }
    if (sec === "skip") continue;
    if (sec === "daily" || sec === "weekly") {
      const spec = (sec === "daily" ? DAILY : WEEKLY).find(sp => specRe(sp).test(t));
      if (!spec) { missed.push(t); continue; }
      const vals = t.match(specRe(spec)).slice(1);
      spec.filter(p => p.f).forEach((p, i) => { s.f[p.f] = vals[i].trim(); });
      read++; continue;
    }
    if (/^[+\-－–—]/.test(t)) {
      const x = parseItem(t, sec === "focus");
      const list = sec === "remind" ? s.remind : sec === "focus" ? s.focus : sec === "c1none" ? s.c1none : sec === "c2" ? s.c2 : pl && pl.items;
      if (x && list) { list.push(x); read++; } else missed.push(t);
      continue;
    }
    if (sec === "clients") {
      const h = t.match(/^([A-Za-z0-9]+)\s*(前后|前|后)\s*(.*)$/);
      if (h) { client = { name: h[1], role: h[2], lines: [] }; s.clients.push(client); pl = { product: h[3], qty: "", items: [] }; client.lines.push(pl); read++; continue; }
      if (client && pl && !pl.qty && !pl.items.length) { pl.qty = t; read++; continue; }
      if (client) { pl = { product: t, qty: "", items: [] }; client.lines.push(pl); read++; continue; }
    }
    missed.push(t);
  }
  return { s, missed, read };
}

document.getElementById("impClose").addEventListener("click", () => impDlg.close());
document.getElementById("impCheck").addEventListener("click", () => {
  parsed = parseJournal(impText.value);
  impResult.textContent = "读懂了 " + parsed.read + " 行。" +
    (parsed.missed.length ? "\n下面 " + parsed.missed.length + " 行没读懂，导入后不会出现，请在文字里改好再检查，或导入后手动加：\n" + parsed.missed.join("\n") : "全部读懂。");
  impDo.disabled = parsed.read === 0;
});
impDo.addEventListener("click", () => {
  if (!parsed || !confirm("用这份日志替换页面上现在的内容？")) return;
  const keep = { archive: S.archive, todo: S.todo }; S = parsed.s; Object.assign(S, keep);
  S.prev = { f: { ...S.f }, hours: S.hours.map(h => ({ ...h })) };
  impDlg.close(); render(); toast("已导入");
});

document.getElementById("export").addEventListener("click", () => {
  const a = el("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: "application/json" }));
  a.download = "日志备份-" + today() + ".json"; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
});
document.getElementById("import").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d.hours || !d.focus) throw 0;
    if (!confirm("用备份文件替换现在的日志？")) return; S = d; render(); toast("已恢复");
  } catch (err) { toast("这个文件不是日志备份"); }
  e.target.value = "";
});

<script>
"use strict";
// ---------- 日常清单: the coded to-do list from the bosses ----------
// A code is MMDD + letter + "-" + the day's number, anywhere in the message: 1019G-02, 1019-02.
// The letter says who sent it. These are group B01's letters (other groups may differ): change only this table.
// sheet = which 01 sheet of the Excel; row = which 02新增统计 row counts it.
const SOURCES = {
  "":  { name: "大老板",   sheet: "indirect", row: "B1" },
  "G": { name: "大老板",   sheet: "indirect", row: "B1" },
  "A": { name: "组长",     sheet: "direct",   row: "A1" },
  "Z": { name: "全组通知", sheet: "direct",   row: "A2" },
  "X": { name: "小组通知", sheet: "direct",   row: "A3" },
};
const CODE_FIND = /(\d{4})([A-Za-z]?)-(\d{1,3})(?!\d)/g;
const CODE_RE = /^(\d{4})([A-Z]?)-(\d{1,3})$/;
const STAT_ROWS = [["A1", "A来自直接上级-单独通知"], ["A2", "A来自直接上级-全组大群通知"], ["A3", "A来自直接上级-组内组小群通知"], ["A", "A来自直接上级-汇总"],
  ["B1", "B来自间接上级-单独通知"], ["B2", "B来自间接上级-全组大群通知"], ["B3", "B来自间接上级-组内组小群通知"], ["B", "B来自间接上级-汇总"]];
const WORKDAYS = [1, 2, 3, 4, 5, 6];   // Mon..Sat get a number in 02新增统计 (0 when nothing came in)
const TEMPLATE_KEY = "journal-xlsx-template";

// which 01 sheet an item goes on: the sheet it was imported from, else by its letter
function sheetOf(x) { return x.sheet || (source(x.code) || {}).sheet || "direct"; }
function TD() {
  if (!S.todo) S.todo = { items: [], sends: [], statsBase: {} };
  // file name = your own part (editable) + "-" + today's date, e.g. 日常清单-B01组-15.Arthur-20261019.xlsx
  if (S.todo.fileBase == null) S.todo.fileBase = S.todo.team && S.todo.name ? `日常清单-${S.todo.team}-${S.todo.name}` : "日常清单-B01组-姓名";
  return S.todo;
}
const fileDate = () => DAY.getFullYear() + T();
const fileName = () => TD().fileBase.trim() + "-" + fileDate() + ".xlsx";
function source(code) { const m = (code || "").match(CODE_RE); return m ? SOURCES[m[2]] : null; }
function noteLines(x) { return x.notes.split("\n").map(l => l.trim()).filter(Boolean); }
// 须知 5: OK = last note line ends with X; G = a note line starts with today's date; otherwise empty
function status(x) {
  const ls = noteLines(x);
  if (ls.length && /[Xx]$/.test(ls[ls.length - 1])) return "OK";
  return ls.some(l => l.startsWith(T())) ? "G" : "";
}
function planOf(x) { const ls = noteLines(x); const m = ls.length && ls[ls.length - 1].match(/(\d{4})$/); return m ? m[1] : ""; }
function syncOk(x) { const ok = status(x) === "OK"; if (ok && !x.xDate) x.xDate = today(); if (!ok) x.xDate = ""; }
// MMDD -> the latest such date on or before ref (a code is never from the future)
function pastDate(md, ref) {
  if (!/^\d{4}$/.test(md)) return null;
  let d = new Date(ref.getFullYear(), +md.slice(0, 2) - 1, +md.slice(2));
  if (d.getMonth() !== +md.slice(0, 2) - 1) return null;
  if (d > ref) d = new Date(ref.getFullYear() - 1, +md.slice(0, 2) - 1, +md.slice(2));
  return d;
}
function codeDate(x) { return pastDate(x.code.slice(0, 4), fromIso(x.got || today())); }
function problems(x) {
  const p = [];
  if (!source(x.code)) p.push("编码格式不对（如 1019G-02）");
  if (!x.desc.trim()) p.push("没有描述");
  if (noteLines(x).some(l => !/^\d{4}/.test(l))) p.push("备注每行要以日期开头");
  if (status(x) !== "OK") { const d = mmddToDate(planOf(x), DAY); if (!d || d <= DAY) p.push("最后一行末尾要写计划日期（晚于今天）"); }
  return p;
}
// numbers for the journal's 组内日常清单表 line
function todoCount(k) {
  const it = TD().items;
  if (k === "tdIn") return it.filter(x => x.got === today()).length;
  if (k === "tdDone") return it.filter(x => x.xDate === today()).length;
  if (k === "tdOpen") return it.filter(x => status(x) !== "OK").length;
  const s = TD().sends.filter(s => s.day === today());
  return s.length ? s[s.length - 1].time.replace(":", "：") + "已传" : "未传";
}

// ---------- pasting boss messages ----------
// Every line holding a code starts a new item; lines before/after belong to the item above.
function parseMessages(text) {
  const out = []; let cur = null;
  text.split(/\r?\n/).forEach(l => {
    const s = l.trim(); if (!s) return;
    const codes = [...s.matchAll(CODE_FIND)];
    if (codes.length) {
      const m = codes[0];
      cur = { code: m[1] + m[2].toUpperCase() + "-" + m[3].padStart(2, "0"),
        desc: s.replace(m[0], "").replace(/^[\s:：,，、.。]+|[\s:：,，、]+$/g, "").replace(/[（(]\s*[）)]/g, "").replace(/\s{2,}/g, " ") };
      out.push(cur);
    } else if (cur) cur.desc += (cur.desc ? " " : "") + s;
    else out.push(cur = { code: "", desc: s });
  });
  return out;
}

// ---------- the to-do tab ----------
const todoEl = document.getElementById("todo");
let showSent = false;
function renderTodo() {
  const td = TD(); todoEl.innerHTML = "";
  const head = el("div", "todohead");
  const fn = el("span", "fname"); fn.contentEditable = "plaintext-only"; fn.textContent = td.fileBase; fn.dataset.ph = "日常清单-组-姓名";
  fn.title = "文件名（可以改）；后面的日期每天自动更新";
  fn.addEventListener("input", () => { td.fileBase = fn.textContent.replace(/[\\/:*?"<>|\n]/g, ""); clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); });
  fn.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); fn.blur(); } });
  head.append("文件名 ", fn, el("span", "calc", "-" + fileDate() + ".xlsx"));
  const counts = el("span", "legend"); counts.id = "todoCounts"; head.append(counts); showCounts();
  const cb = el("label", "legend"); const c = el("input"); c.type = "checkbox"; c.checked = showSent;
  c.addEventListener("change", () => { showSent = c.checked; renderTodo(); }); cb.append(c, " 显示已传的已收官记录"); head.append(cb);
  todoEl.append(head);

  const add = el("div", "addbox");
  const ta = el("textarea"); ta.placeholder = "把上级带编码的消息粘贴到这里（可以一次贴几条），编码在哪个位置都可以，如 1019G-02";
  const b = el("button", "main", "加入清单");
  b.addEventListener("click", () => {
    const msgs = parseMessages(ta.value); let added = 0, dup = [];
    msgs.forEach(m => {
      if (m.code && td.items.some(x => x.code === m.code)) { dup.push(m.code); return; }
      td.items.push({ code: m.code, desc: m.desc, notes: T(), xDate: "", sent: 0, okSent: false, got: today() }); added++;
    });
    ta.value = ""; save(); renderTodo(); refresh();
    toast("加入 " + added + " 条" + (dup.length ? "；已在清单里：" + dup.join("，") : ""));
  });
  add.append(ta, b); todoEl.append(add);

  const list = td.items.filter(x => showSent || !x.sent)
    .sort((a, b) => (codeDate(a) || 0) - (codeDate(b) || 0) || a.code.localeCompare(b.code));
  list.forEach(x => todoEl.append(card(x)));
  if (!list.length) todoEl.append(el("p", "legend", "清单是空的。"));
}
function showCounts() {
  const c = document.getElementById("todoCounts");
  if (c) c.textContent = `　未结 ${todoCount("tdOpen")} · 今天收到 ${todoCount("tdIn")} · 今天完成 ${todoCount("tdDone")} · 传递：${todoCount("tdSent")}`;
}
function card(x) {
  const td = TD(), box = el("div", "card");
  const top = el("div", "cardtop");
  const code = el("span", "code"); code.contentEditable = "plaintext-only"; code.textContent = x.code; code.dataset.ph = "编码";
  const who = el("span", "chip");
  const desc = el("span", "desc"); desc.contentEditable = "plaintext-only"; desc.textContent = x.desc; desc.dataset.ph = "描述";
  const st = el("span", "chip st");
  const del = ui("删除", () => { if (confirm("删除 " + x.code + "？")) { td.items.splice(td.items.indexOf(x), 1); save(); renderTodo(); refresh(); } });
  top.append(code, who, desc, st, del);
  const notes = el("textarea", "notes"); notes.value = x.notes; notes.rows = 1;
  const btns = el("div", "cardbtns");
  const upd = el("button", "", "今日更新");
  const done = el("button", "", "收官 X");
  const prob = el("span", "prob");
  btns.append(upd, done, prob);
  box.append(top, notes, btns);

  const fit = () => { notes.style.height = "auto"; notes.style.height = notes.scrollHeight + 2 + "px"; };
  const show = () => {
    const s = source(x.code), stat = status(x);
    who.textContent = s ? s.name : "?";
    st.textContent = stat || "未结"; st.dataset.s = stat;
    const p = problems(x); prob.textContent = p.join("；");
    box.classList.toggle("bad", p.length > 0); box.classList.toggle("ok", stat === "OK");
  };
  const changedItem = () => { syncOk(x); show(); showCounts(); refresh(); clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); };
  code.addEventListener("input", () => { x.code = code.textContent.trim().toUpperCase(); changedItem(); });
  desc.addEventListener("input", () => { x.desc = desc.textContent; changedItem(); });
  [code, desc].forEach(e => e.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); e.blur(); } }));
  notes.addEventListener("input", () => { x.notes = notes.value; fit(); changedItem(); });
  const appendLine = s => { x.notes = x.notes.replace(/\s+$/, "") + (x.notes.trim() ? "\n" : "") + s; notes.value = x.notes; fit(); changedItem(); };
  upd.addEventListener("click", () => {
    const ls = noteLines(x);
    if (!(ls.length && ls[ls.length - 1] === T())) appendLine(T());
    notes.focus(); notes.setSelectionRange(notes.value.length, notes.value.length);
  });
  done.addEventListener("click", () => {
    const ls = noteLines(x), last = ls[ls.length - 1] || "";
    if (/[Xx]$/.test(last)) return;
    if (last.startsWith(T()) && last.length > 4) { x.notes = x.notes.replace(/\s+$/, "").replace(/\d{4}$/, "") + "。X"; notes.value = x.notes; fit(); changedItem(); }
    else { if (last === T()) x.notes = x.notes.replace(/\s+$/, "").slice(0, -4).replace(/\s+$/, ""); appendLine(T() + "已处理。X"); }
    const i = notes.value.lastIndexOf("已处理"); if (i >= 0) { notes.focus(); notes.setSelectionRange(i, i + 3); }
  });
  show(); setTimeout(fit);
  return box;
}

// ---------- zip (an .xlsx is a zip of XML files); the browser does the compression ----------
async function pipe(u8, stream) { return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer()); }
async function unzip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let e = u8.length - 22; while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error("不是xlsx文件");
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  const out = [];
  for (let i = 0; i < n; i++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nlen = dv.getUint16(p + 28, true),
      xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
    const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    const raw = u8.subarray(start, start + csize);
    out.push({ name, data: method === 0 ? raw.slice() : await pipe(raw, new DecompressionStream("deflate-raw")) });
    p += 46 + nlen + xlen + clen;
  }
  return out;
}
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function zip(files) {
  const parts = [], central = []; let off = 0;
  for (const f of files) {
    const name = new TextEncoder().encode(f.name), comp = await pipe(f.data, new CompressionStream("deflate-raw")), crc = crc32(f.data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x800, true); h.setUint16(8, 8, true); h.setUint16(12, 33, true);
    h.setUint32(14, crc, true); h.setUint32(18, comp.length, true); h.setUint32(22, f.data.length, true); h.setUint16(26, name.length, true);
    parts.push(new Uint8Array(h.buffer), name, comp);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x800, true); c.setUint16(10, 8, true); c.setUint16(14, 33, true);
    c.setUint32(16, crc, true); c.setUint32(20, comp.length, true); c.setUint32(24, f.data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), name);
    off += 30 + name.length + comp.length;
  }
  const csize = central.reduce((a, b) => a + b.length, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

// ---------- the workbook ----------
const NS = "http://schemas.openxmlformats.org/spreadsheetml/2006/main", RNS = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
const xml = s => new DOMParser().parseFromString(s, "application/xml");
const xmlText = d => new XMLSerializer().serializeToString(d);
function colNum(ref) { let n = 0; for (const ch of ref.replace(/\d+/g, "")) n = n * 26 + ch.charCodeAt(0) - 64; return n; }
function colName(n) { let s = ""; while (n) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
function tText(node) {        // text of a shared string / inline string, without the phonetic (rPh) parts
  let s = ""; node.childNodes.forEach(c => { if (c.localName === "t") s += c.textContent; else if (c.localName === "r") s += tText(c); }); return s;
}
function book(files) {
  const get = n => files.find(f => f.name === n);
  const text = n => new TextDecoder().decode(get(n).data);
  const put = (n, s) => { const f = get(n); if (f) f.data = new TextEncoder().encode(s); else files.push({ name: n, data: new TextEncoder().encode(s) }); };
  const wb = xml(text("xl/workbook.xml")), rels = xml(text("xl/_rels/workbook.xml.rels"));
  const target = {};
  [...rels.getElementsByTagName("Relationship")].forEach(r => { target[r.getAttribute("Id")] = "xl/" + r.getAttribute("Target").replace(/^\/?xl\//, ""); });
  const sheets = [...wb.getElementsByTagName("sheet")].map((s, i) => ({ name: s.getAttribute("name"), file: target[s.getAttributeNS(RNS, "id")], index: i }));
  const ss = get("xl/sharedStrings.xml") ? [...xml(text("xl/sharedStrings.xml")).getElementsByTagName("si")].map(tText) : [];
  const find = test => sheets.find(s => test(s.name));
  return { files, get, text, put, wb, rels, sheets, ss,
    direct: find(n => n.startsWith("01") && n.includes("直接")), indirect: find(n => n.startsWith("01") && n.includes("间接")), stats: find(n => n.startsWith("02")) };
}
function readRows(B, sheet) {
  const d = xml(B.text(sheet.file)), rows = [];
  [...d.getElementsByTagName("row")].forEach(r => {
    const cells = {};
    [...r.getElementsByTagName("c")].forEach(c => {
      const t = c.getAttribute("t"), v = c.getElementsByTagName("v")[0], is = c.getElementsByTagName("is")[0];
      cells[colNum(c.getAttribute("r"))] = t === "s" ? B.ss[+v.textContent] : t === "inlineStr" ? (is ? tText(is) : "") : v ? v.textContent : "";
    });
    rows.push({ r: +r.getAttribute("r"), cells });
  });
  return rows;
}
const serial = isoDay => { const [y, m, d] = isoDay.split("-").map(Number); return (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5; };
function serialToIso(v) { const n = parseFloat(v); if (isNaN(n)) return ""; const d = new Date(Date.UTC(1899, 11, 30) + n * 864e5); return iso(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
const y2 = y => "2" + String(y % 100).padStart(2, "0");                              // 2024 -> "224"
const monthCode = d => y2(d.getFullYear()) + String(d.getMonth() + 1).padStart(2, "0");    // -> "22401"
const bizYear = d => y2(d.getFullYear() + (d.getMonth() >= 10 ? 1 : 0));                    // business year starts in November

function cell(d, ref, s, kind, val) {
  const c = d.createElementNS(NS, "c"); c.setAttribute("r", ref); if (s) c.setAttribute("s", s);
  if (kind === "str" && val !== "") {
    c.setAttribute("t", "inlineStr");
    const is = d.createElementNS(NS, "is"), t = d.createElementNS(NS, "t");
    t.setAttributeNS("http://www.w3.org/XML/1998/namespace", "xml:space", "preserve"); t.textContent = val; is.append(t); c.append(is);
  } else if (kind === "num" && val !== "" && val != null) { const v = d.createElementNS(NS, "v"); v.textContent = val; c.append(v); }
  else if (kind === "f") { const f = d.createElementNS(NS, "f"); f.textContent = val; c.append(f); }
  return c;
}
function styleMap(row) { const m = {}; if (row) [...row.getElementsByTagName("c")].forEach(c => { m[colNum(c.getAttribute("r"))] = c.getAttribute("s"); }); return m; }
function colWidths(d) {
  const w = {}; [...d.getElementsByTagName("col")].forEach(c => { for (let i = +c.getAttribute("min"); i <= Math.min(+c.getAttribute("max"), 60); i++) w[i] = +c.getAttribute("width"); }); return w;
}
function textLines(s, width) {   // rough wrapped line count: a Chinese character is 2 width units
  return s.split("\n").reduce((n, l) => n + Math.max(1, Math.ceil([...l].reduce((a, ch) => a + (ch.charCodeAt(0) > 255 ? 2 : 1), 0) / Math.max(width - 1, 4))), 0);
}
function setFilterName(B, sheet, ref) {
  let dn = B.wb.getElementsByTagName("definedNames")[0];
  if (!dn) { dn = B.wb.createElementNS(NS, "definedNames"); const after = B.wb.getElementsByTagName("sheets")[0]; after.parentNode.insertBefore(dn, after.nextSibling); }
  let n = [...dn.getElementsByTagName("definedName")].find(x => x.getAttribute("name") === "_xlnm._FilterDatabase" && x.getAttribute("localSheetId") === String(sheet.index));
  if (!n) { n = B.wb.createElementNS(NS, "definedName"); n.setAttribute("name", "_xlnm._FilterDatabase"); n.setAttribute("localSheetId", sheet.index); n.setAttribute("hidden", "1"); dn.append(n); }
  n.textContent = "'" + sheet.name + "'!" + ref.replace(/([A-Z]+)(\d+)/g, "$$$1$$$2");
}
const AFTER_FILTER = ["sortState", "dataConsolidate", "customSheetViews", "mergeCells", "phoneticPr", "conditionalFormatting", "dataValidations", "hyperlinks", "printOptions", "pageMargins", "pageSetup", "headerFooter", "drawing", "legacyDrawing", "tableParts", "extLst"];

// one 01日常清单 sheet: header row kept, every item one row, sent ones hidden by the 先前已传 filter
function fillList(B, sheet, items, base) {
  const d = xml(base), sd = d.getElementsByTagName("sheetData")[0];
  const rows = [...sd.getElementsByTagName("row")];
  const header = rows.find(r => r.getAttribute("r") === "1"), sample = rows.find(r => +r.getAttribute("r") > 1) || header;
  const st = styleMap(sample), rowS = sample && sample !== header ? sample.getAttribute("s") : null, w = colWidths(d);
  rows.forEach(r => { if (r !== header) sd.removeChild(r); });
  items.forEach((x, i) => {
    const r = i + 2, row = d.createElementNS(NS, "row");
    row.setAttribute("r", r); row.setAttribute("spans", "1:6");
    if (rowS) { row.setAttribute("s", rowS); row.setAttribute("customFormat", "1"); }
    const h = Math.max(textLines(x.code, w[1] || 9), textLines(x.desc, w[2] || 58), textLines(x.notes, w[6] || 37));
    row.setAttribute("ht", (Math.max(h, 1) * 13.9 + (h > 1 ? 0 : 0)).toFixed(2)); row.setAttribute("customHeight", "1");
    if (x.sent) row.setAttribute("hidden", "1");
    row.append(cell(d, "A" + r, st[1], "str", x.code), cell(d, "B" + r, st[2], "str", x.desc), cell(d, "C" + r, st[3], "str", status(x)),
      cell(d, "D" + r, st[4], "num", x.xDate ? serial(x.xDate) : ""), cell(d, "E" + r, st[5], "num", x.sent ? 1 : ""), cell(d, "F" + r, st[6], "str", x.notes.trim()));
    sd.append(row);
  });
  const ref = "A1:F" + (items.length + 1), ws = d.documentElement;
  const dim = d.getElementsByTagName("dimension")[0]; if (dim) dim.setAttribute("ref", ref);
  let af = d.getElementsByTagName("autoFilter")[0];
  if (!af) {
    af = d.createElementNS(NS, "autoFilter");
    const before = [...ws.children].find(c => AFTER_FILTER.includes(c.localName));
    ws.insertBefore(af, before || null);
  }
  af.setAttribute("ref", ref);
  [...af.getElementsByTagName("filterColumn")].forEach(f => af.removeChild(f));
  const fc = d.createElementNS(NS, "filterColumn"), fl = d.createElementNS(NS, "filters");
  fc.setAttribute("colId", "4"); fl.setAttribute("blank", "1"); fc.append(fl); af.append(fc);
  let pr = d.getElementsByTagName("sheetPr")[0];
  if (!pr) { pr = d.createElementNS(NS, "sheetPr"); ws.insertBefore(pr, ws.firstElementChild); }
  pr.setAttribute("filterMode", "1");
  setFilterName(B, sheet, ref);
  B.put(sheet.file, xmlText(d));
}

// 02新增统计: 8 rows per month (A/B x 单独/大群/小群 + 汇总), one column per day, sums as formulas
function statValues() {
  const out = {}, td = TD();
  Object.entries(td.statsBase || {}).forEach(([k, days]) => { out[k] = { ...days }; });
  const counted = {};
  td.items.forEach(x => {
    const s = source(x.code), d = codeDate(x); if (!s || !d) return;
    const k = monthCode(d) + "|" + s.row; (counted[k] ||= {})[d.getDate()] = (counted[k][d.getDate()] || 0) + 1;
  });
  Object.entries(counted).forEach(([k, days]) => { out[k] ||= {}; Object.entries(days).forEach(([day, n]) => { out[k][day] = Math.max(out[k][day] || 0, n); }); });
  return out;
}
function fillStats(B, sheet) {
  const d = xml(B.text(sheet.file)), sd = d.getElementsByTagName("sheetData")[0];
  const rows = [...sd.getElementsByTagName("row")];
  const header = rows.find(r => r.getAttribute("r") === "1");
  const tpl = k => rows.find(r => +r.getAttribute("r") === 2 + k) || rows.find(r => +r.getAttribute("r") === 2) || header;
  const styles = STAT_ROWS.map((_, k) => ({ row: tpl(k), st: styleMap(tpl(k)) }));
  rows.forEach(r => { if (r !== header) sd.removeChild(r); });
  const vals = statValues();
  // months: from the first one with data to this month
  const months = Object.keys(vals).map(k => k.split("|")[0]).sort();
  let m = months.length ? new Date(2000 + +months[0].slice(1, 3), +months[0].slice(3) - 1, 1) : new Date(DAY.getFullYear(), DAY.getMonth(), 1);
  let r = 2;
  while (m <= DAY) {
    const mc = monthCode(m), days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    STAT_ROWS.forEach(([key, label], k) => {
      const { row: t, st } = styles[k], row = d.createElementNS(NS, "row"), sum = key.length === 1;
      row.setAttribute("r", r);
      ["s", "customFormat", "ht", "customHeight"].forEach(a => { if (t && t !== header && t.getAttribute(a)) row.setAttribute(a, t.getAttribute(a)); });
      row.append(cell(d, "A" + r, st[1], "num", bizYear(m)), cell(d, "B" + r, st[2], "num", mc),
        sum ? cell(d, "C" + r, st[3], "f", `SUM(C${r - 3}:C${r - 1})`) : cell(d, "C" + r, st[3], "num", 1),
        cell(d, "D" + r, st[4], "str", label));
      for (let day = 1; day <= 31; day++) {
        const col = colName(4 + day), date = new Date(m.getFullYear(), m.getMonth(), day);
        if (sum) { row.append(cell(d, col + r, st[4 + day], "f", `SUM(${col}${r - 3}:${col}${r - 1})`)); continue; }
        const v = (vals[mc + "|" + key] || {})[day];
        const fill = day <= days && date <= DAY && WORKDAYS.includes(date.getDay());
        row.append(cell(d, col + r, st[4 + day], "num", v != null ? v : fill ? 0 : ""));
      }
      row.append(cell(d, "AJ" + r, st[36], "f", sum ? `SUM(AJ${r - 3}:AJ${r - 1})` : `SUM(E${r}:AI${r})`));
      sd.append(row); r++;
    });
    m = new Date(m.getFullYear(), m.getMonth() + 1, 1);
  }
  const dim = d.getElementsByTagName("dimension")[0]; if (dim) dim.setAttribute("ref", "A1:BF" + (r - 1));
  B.put(sheet.file, xmlText(d));
}

function b64(u8) { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function templateBytes() { try { const t = localStorage.getItem(TEMPLATE_KEY); if (t) return unb64(t); } catch (e) {} return unb64(DEFAULT_XLSX); }

async function buildXlsx() {
  const td = TD();
  // 须知 6: an item that was OK and already sent once gets 先前已传 = 1
  td.items.forEach(x => { if (status(x) === "OK" && x.okSent) x.sent = 1; });
  const B = book(await unzip(templateBytes().buffer));
  const byCode = (a, b) => (codeDate(a) || 0) - (codeDate(b) || 0) || a.code.localeCompare(b.code);
  const direct = td.items.filter(x => sheetOf(x) === "direct").sort(byCode);
  const indirect = td.items.filter(x => sheetOf(x) === "indirect").sort(byCode);
  if (B.direct) fillList(B, B.direct, direct, B.text(B.direct.file));
  if (B.indirect && indirect.length) {
    // the 间接上级 sheet may be empty in the file: then it gets the 直接上级 sheet's columns and header
    const own = B.text(B.indirect.file);
    const base = /<row /.test(own) ? own : B.text(B.direct.file)
      .replace(/ xr:uid="\{[^}]*\}"/g, "").replace(/<pageSetup([^>]*?) r:id="[^"]*"/, "<pageSetup$1").replace(/<(legacyDrawing|drawing)[^>]*\/>/g, "")
      .replace(/<tabColor[^>]*\/>/, "");
    fillList(B, B.indirect, indirect, base);
  }
  if (B.stats) fillStats(B, B.stats);
  // formulas changed: Excel recalculates on opening; the old calculation chain is dropped
  const calc = B.wb.getElementsByTagName("calcPr")[0]; if (calc) calc.setAttribute("fullCalcOnLoad", "1");
  B.put("xl/workbook.xml", xmlText(B.wb));
  B.files = B.files.filter(f => f.name !== "xl/calcChain.xml");
  B.put("xl/_rels/workbook.xml.rels", B.text("xl/_rels/workbook.xml.rels").replace(/<Relationship [^>]*calcChain[^>]*\/>/, ""));
  B.put("[Content_Types].xml", B.text("[Content_Types].xml").replace(/<Override [^>]*calcChain[^>]*\/>/, ""));
  return zip(B.files);
}

async function downloadXlsx() {
  const td = TD();
  if (!td.fileBase.trim()) { toast("先在上面填写文件名"); return; }
  const blob = await buildXlsx();
  const now = new Date(), name = fileName();
  const a = el("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  td.sends.push({ day: today(), time: String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0") });
  td.sends = td.sends.slice(-200);
  td.items.forEach(x => { if (status(x) === "OK") x.okSent = true; });
  save(); renderTodo(); refresh();
  toast("已下载 " + name);
}

// reading the current Excel once: items from both 01 sheets, 02 numbers kept, the file becomes the template
async function importXlsx(file) {
  const buf = await file.arrayBuffer(), B = book(await unzip(buf.slice(0)));
  if (!B.direct) throw new Error("找不到“01日常清单-直接上级”子表");
  const items = [];
  [B.direct, B.indirect].forEach(sh => {
    if (!sh) return;
    const sheet = sh === B.direct ? "direct" : "indirect";
    readRows(B, sh).filter(r => r.r > 1).forEach(({ cells: c }) => {
      const code = String(c[1] || "").trim().toUpperCase(); if (!code && !c[2]) return;
      const x = { code, desc: String(c[2] || ""), notes: String(c[6] || "").replace(/\r/g, ""), xDate: serialToIso(c[4]),
        sent: String(c[5] || "").trim() === "1" ? 1 : 0, okSent: false, got: "", sheet };
      const d = pastDate(code.slice(0, 4), x.xDate ? fromIso(x.xDate) : DAY);
      x.got = d ? iso(d) : today();
      if (status(x) === "OK" && !x.xDate) x.xDate = x.got;
      items.push(x);
    });
  });
  const base = {};
  if (B.stats) readRows(B, B.stats).filter(r => r.r > 1).forEach(({ cells: c }) => {
    const month = String(c[2] || ""), key = (STAT_ROWS.find(s => s[1] === String(c[4] || "").trim()) || [])[0];
    if (!/^\d{5}$/.test(month) || !key || key.length < 2) return;
    for (let day = 1; day <= 31; day++) { const v = c[4 + day]; if (v !== undefined && v !== "" && !isNaN(+v)) (base[month + "|" + key] ||= {})[day] = +v; }
  });
  return { items, base, bytes: new Uint8Array(buf) };
}

// ---------- tabs and buttons ----------
function tab(name) {
  document.body.dataset.tab = name;
  try { localStorage.setItem("journal-tab", name); } catch (e) {}
  if (name === "todo") renderTodo();
}
document.getElementById("tabJournal").addEventListener("click", () => { tab("journal"); render(); });
document.getElementById("tabTodo").addEventListener("click", () => tab("todo"));
document.getElementById("xlsxOut").addEventListener("click", () => downloadXlsx().catch(e => toast("下载失败：" + e.message)));
document.getElementById("xlsxIn").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const r = await importXlsx(f), td = TD();
    if (!confirm(`读到 ${r.items.length} 条记录。用这个文件替换现在的日常清单？（这个文件也会成为以后下载的样子）`)) return;
    td.items = r.items; td.statsBase = r.base;
    // the imported file's name without its date part becomes the file name
    const m = f.name.replace(/\.xlsx$/i, "").match(/^(.*?)-\d{6,8}(-\d+)?$/); if (m) td.fileBase = m[1];
    try { localStorage.setItem(TEMPLATE_KEY, b64(r.bytes)); } catch (err) { toast("文件太大，没有存成样板；下载会用默认样子"); }
    save(); renderTodo(); refresh(); toast("已导入 " + r.items.length + " 条");
  } catch (err) { toast("读不了这个文件：" + err.message); }
});

let startTab = "journal"; try { startTab = localStorage.getItem("journal-tab") || "journal"; } catch (e) {}
render();
tab(startTab);
